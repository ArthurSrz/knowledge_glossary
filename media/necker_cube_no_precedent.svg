<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;"><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">The cube with no precedent</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A Necker cube: a wireframe cube drawn with uniform lines and no occlusion cues, so perception flips between two readings of which face is in front. Face A and face B are both candidates and nothing in the image decides between them.</desc>
<rect x="0" y="0" width="680" height="470" fill="#FFFFFF" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<rect x="200" y="150" width="200" height="200" fill="none" stroke="#191919" stroke-width="1.5" style="fill:none;stroke:rgb(25, 25, 25);color:rgb(11, 11, 11);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<rect x="280" y="90" width="200" height="200" fill="none" stroke="#191919" stroke-width="1.5" style="fill:none;stroke:rgb(25, 25, 25);color:rgb(11, 11, 11);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<line x1="200" y1="150" x2="280" y2="90" stroke="#191919" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(25, 25, 25);color:rgb(11, 11, 11);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<line x1="400" y1="150" x2="480" y2="90" stroke="#191919" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(25, 25, 25);color:rgb(11, 11, 11);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<line x1="200" y1="350" x2="280" y2="290" stroke="#191919" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(25, 25, 25);color:rgb(11, 11, 11);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<line x1="400" y1="350" x2="480" y2="290" stroke="#191919" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(25, 25, 25);color:rgb(11, 11, 11);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<text x="248" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#0A66C2" style="fill:rgb(10, 102, 194);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:auto">A</text>
<text x="452" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#0A66C2" style="fill:rgb(10, 102, 194);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:auto">B</text>

<text x="340" y="410" text-anchor="middle" font-size="13" fill="#666666" style="fill:rgb(102, 102, 102);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Which face is the front — A or B? Keep looking: your answer will flip, then flip back.</text>
<text x="340" y="430" text-anchor="middle" font-size="13" fill="#666666" style="fill:rgb(102, 102, 102);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Nothing in the image decides. With no precedent, <tspan fill="#B24020" font-weight="600" style="fill:rgb(178, 64, 32);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:auto">no signal settles the question — you must build the answer, not find it.</tspan></text>
</svg>